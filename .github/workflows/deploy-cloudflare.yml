name: Deploy ColetaFlow to Cloudflare Pages

on:
  push:
    branches:
      - feature/shared-collections
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    environment: cloudflare-preview
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check API and Pages Function syntax
        run: |
          find api functions -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Build frontend
        run: npm run build
      - name: Install Wrangler
        run: npm install --global wrangler@latest
      - name: Ensure Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! wrangler pages project list | grep -Eq '(^|[[:space:]])coletaflow([[:space:]]|$)'; then
            wrangler pages project create coletaflow --production-branch main
          fi
      - name: Diagnose Cloudflare Preview bindings (names only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/coletaflow" \\
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \\
            -H "Content-Type: application/json" | node -e '
          let raw=""; process.stdin.on("data", d => raw += d); process.stdin.on("end", () => {
            const data=JSON.parse(raw);
            if (!data.success) { console.error("Cloudflare API não confirmou leitura do projeto"); process.exit(1); }
            for (const envName of ["preview", "production"]) {
              const cfg=data.result?.deployment_configs?.[envName] || {};
              const vars=cfg.env_vars || {};
              const hyperdrive=cfg.hyperdrive_bindings || {};
              console.log(envName.toUpperCase()+" variables: "+Object.entries(vars).map(([k,v])=>k+" ("+(v?.type||"tipo desconhecido")+")").join(", "));
              console.log(envName.toUpperCase()+" Hyperdrive bindings: "+Object.keys(hyperdrive).join(", "));
            }
          });'
      - name: Deploy feature preview using dashboard bindings

        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler pages deploy dist --project-name coletaflow --branch feature/shared-collections --commit-dirty=true
