name: Deploy ColetaFlow to Cloudflare Pages

on:
  push:
    branches:
      - feature/shared-collections
      - integration/site-official-android-mlkit
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    environment: cloudflare-preview
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check API and Pages Function syntax
        run: |
          find api functions -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Build frontend
        run: npm run build
      - name: Install Wrangler
        run: npm install --global wrangler@latest
      - name: Ensure Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! wrangler pages project list | grep -Eq '(^|[[:space:]])coletaflow([[:space:]]|$)'; then
            wrangler pages project create coletaflow --production-branch main
          fi
      - name: Configure Cloudflare Preview bindings securely
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COLETAFLOW_OWNER_SETUP_KEY: ${{ secrets.COLETAFLOW_OWNER_SETUP_KEY }}
        run: |
          node <<'NODE'
          const base = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/pages/projects/coletaflow`;
          const headers = {
            Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,
            "Content-Type": "application/json"
          };
          async function api(method, body) {
            const response = await fetch(base, {
              method,
              headers,
              ...(body ? { body: JSON.stringify(body) } : {})
            });
            const data = await response.json();
            if (!response.ok || !data.success) {
              const errors = (data.errors || []).map(e => e.message).join("; ");
              throw new Error(`Cloudflare API ${method} falhou (${response.status}): ${errors || "sem detalhes"}`);
            }
            return data.result;
          }
          (async () => {
            const key = process.env.COLETAFLOW_OWNER_SETUP_KEY;
            if (!key || key.length < 32) throw new Error("Secret COLETAFLOW_OWNER_SETUP_KEY ausente ou menor que 32 caracteres.");
            const project = await api("GET");
            const production = project.deployment_configs?.production || {};
            const productionVars = production.env_vars || {};
            const email = productionVars.COLETAFLOW_OWNER_EMAIL?.value;
            const hyperdriveId = production.hyperdrive_bindings?.HYPERDRIVE?.id;
            if (!email) throw new Error("Não encontrei COLETAFLOW_OWNER_EMAIL na configuração de Produção; não vou inventar nem alterar esse dado.");
            if (!hyperdriveId) throw new Error("Não encontrei o ID do Hyperdrive HYPERDRIVE na Produção; não vou criar um vínculo incorreto.");
            await api("PATCH", {
              deployment_configs: {
                preview: {
                  env_vars: {
                    COLETAFLOW_OWNER_EMAIL: { type: "plain_text", value: email },
                    COLETAFLOW_OWNER_SETUP_KEY: { type: "secret_text", value: key }
                  },
                  hyperdrive_bindings: {
                    HYPERDRIVE: { id: hyperdriveId }
                  }
                }
              }
            });
            const updated = await api("GET");
            const preview = updated.deployment_configs?.preview || {};
            const vars = preview.env_vars || {};
            const bindings = preview.hyperdrive_bindings || {};
            if (vars.COLETAFLOW_OWNER_EMAIL?.type !== "plain_text" ||
                vars.COLETAFLOW_OWNER_SETUP_KEY?.type !== "secret_text" ||
                !bindings.HYPERDRIVE?.id) {
              throw new Error("Cloudflare não confirmou todas as configurações no Preview.");
            }
            console.log("Preview configurado e verificado: e-mail do dono, chave secreta e Hyperdrive HYPERDRIVE.");
          })().catch(error => {
            console.error(error.message);
            process.exit(1);
          });
          NODE
      - name: Deploy feature preview using dashboard bindings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "$GITHUB_REF_NAME" = "integration/site-official-android-mlkit" ]; then
            wrangler pages deploy dist --project-name coletaflow --branch integration-site-official-android-mlkit --commit-dirty=true
          else
            wrangler pages deploy dist --project-name coletaflow --branch feature/shared-collections --commit-dirty=true
          fi
