name: Build ColetaFlow Android APK

on:
  push:
    branches: [feature/shared-collections]
    paths:
      - 'capacitor.config.ts'
      - 'resources/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-apk.yml'
      - 'src/main.tsx'
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Add native Google ML Kit dependency for APK build only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          p = Path('package.json')
          data = json.loads(p.read_text())
          data.setdefault('dependencies', {})['@capacitor-mlkit/barcode-scanning'] = '7.1.0'
          p.write_text(json.dumps(data, indent=2) + '\\n')
          PY
          npm install --no-save sharp
      - name: Restore native ML Kit scanner in APK build only
        run: |
          git fetch --no-tags --depth=1 origin refs/heads/integration/site-official-android-mlkit:refs/remotes/origin/integration/site-official-android-mlkit
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          current_path = Path('src/App.tsx')
          current = current_path.read_text()
          reference = subprocess.check_output(
              ['git', 'show', 'origin/integration/site-official-android-mlkit:src/App.tsx'],
              text=True
          )
          start = "  useEffect(() => {\n    if (!cameraOpen || !videoRef.current || pendingCode) return;"
          end = "\n  const loadWorkbook = async (file: File) => {"
          if start not in current or start not in reference:
              raise SystemExit('Bloco do leitor não encontrado; build cancelado.')
          current_start = current.index(start)
          current_end = current.index(end, current_start)
          reference_start = reference.index(start)
          reference_end = reference.index(end, reference_start)
          native_scanner = reference[reference_start:reference_end]
          old_formats = "BarcodeFormat.Ean13,\n              BarcodeFormat.Ean8,\n              BarcodeFormat.UpcA,\n              BarcodeFormat.UpcE,\n              BarcodeFormat.Itf"
          new_formats = "BarcodeFormat.Aztec,\n              BarcodeFormat.Codabar,\n              BarcodeFormat.Code128,\n              BarcodeFormat.Code39,\n              BarcodeFormat.Code93,\n              BarcodeFormat.Ean13,\n              BarcodeFormat.Ean8,\n              BarcodeFormat.Itf,\n              BarcodeFormat.UpcA,\n              BarcodeFormat.UpcE"
          if old_formats not in native_scanner:
              raise SystemExit('Lista nativa original do ML Kit não encontrada; build cancelado.')
          native_scanner = native_scanner.replace(old_formats, new_formats, 1)
          native_scanner = native_scanner.replace('await BarcodeScanner.disableTorch().catch(() => {});', 'await Promise.resolve((BarcodeScanner as any).disableTorch?.()).catch(() => {});')
          current = current[:current_start] + native_scanner + current[current_end:]
          react_import = "import { useEffect, useMemo, useRef, useState, type FormEvent } from 'react';"
          if react_import not in current:
              raise SystemExit('Import do React não encontrado; build cancelado.')
          current = current.replace(react_import, react_import + "\nimport { Capacitor } from '@capacitor/core';", 1)
          scanner_ref = "  const scannerRef = useRef<IScannerControls | null>(null);"
          if scanner_ref not in current:
              raise SystemExit('Referência da câmera não encontrada; build cancelado.')
          current = current.replace(scanner_ref, scanner_ref + "\n  const nativeCameraActiveRef = useRef(false);", 1)
          current_path.write_text(current)

          css_path = Path('src/styles.css')
          css = css_path.read_text()
          native_css = """
          \n/* Native Google ML Kit camera preview: APK build only */
          html:has(body.barcode-scanner-active),body.barcode-scanner-active{background:transparent!important}
          body.barcode-scanner-active #root{visibility:hidden!important}
          body.barcode-scanner-active::before,body.barcode-scanner-active::after,body.barcode-scanner-active:has(.camera-box)::before{display:none!important;content:none!important}
          body.barcode-scanner-active>.camera-box{position:fixed!important;inset:0!important;left:0!important;top:0!important;transform:none!important;width:100vw!important;height:100dvh!important;max-width:none!important;max-height:none!important;margin:0!important;padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 14px)!important;background:transparent!important;border:0!important;border-radius:0!important;box-shadow:none!important;overflow:hidden!important;z-index:2147483000!important}
          body.barcode-scanner-active>.camera-box video{display:none!important}
          body.barcode-scanner-active>.camera-box .camera-status{position:absolute;top:calc(env(safe-area-inset-top) + 14px);left:14px;right:130px;z-index:2;padding:10px 12px;border-radius:9px;background:#071827d9;color:#e7f5fb}
          body.barcode-scanner-active>.camera-box .camera-guide{position:absolute!important;left:50%!important;top:50%!important;transform:translate(-50%,-50%)!important;z-index:1}
          body.barcode-scanner-active>.camera-box .camera-zoom-controls{right:14px!important;top:50%!important;z-index:3}
          body.barcode-scanner-active>.camera-box .camera-bottom-controls{position:absolute!important;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 22px);z-index:3}
          body.barcode-scanner-active>.camera-box .camera-close{position:absolute!important;top:calc(env(safe-area-inset-top) + 14px)!important;right:14px!important;z-index:4}
          """
          if 'body.barcode-scanner-active #root' not in css:
              css_path.write_text(css + native_css)
          print('APK usa Google ML Kit nativo com AZTEC, CODABAR, CODE_128, CODE_39, CODE_93, EAN_13, EAN_8, ITF, UPC_A e UPC_E. QR_CODE, DATA_MATRIX e PDF_417 permanecem excluídos.')
          PY
      - name: Build web app
        run: npm run build
      - name: Generate Android image resources
        run: |
          node --input-type=module -e "import sharp from 'sharp'; await sharp('resources/icon.svg').resize(1024,1024).png().toFile('resources/icon.png'); await sharp('resources/splash.svg').resize(1024,1024).png().toFile('resources/splash.png');"
      - name: Add Android platform
        run: npx cap add android
      - name: Generate launcher and splash resources
        run: |
          mkdir -p assets
          cp resources/icon.png assets/icon.png
          cp resources/splash.png assets/splash.png
          npx capacitor-assets generate --android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Ensure camera and internet permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          marker='<manifest '
          if 'android.permission.CAMERA' not in s:
              i=s.find('>', s.find(marker))+1
              s=s[:i]+'\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.INTERNET" />'+s[i:]
          p.write_text(s)
          PY
      - name: Configure native Android downloads
        run: |
          mkdir -p android/app/src/main/java/com/coletaflow/app
          cat > android/app/src/main/java/com/coletaflow/app/MainActivity.java <<'JAVA'
          package com.coletaflow.app;

          import android.content.ContentValues;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.MediaStore;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import android.widget.Toast;
          import com.getcapacitor.BridgeActivity;
          import java.io.OutputStream;
          import java.util.Base64;

          public class MainActivity extends BridgeActivity {
              private final Handler handler = new Handler(Looper.getMainLooper());
              private final Runnable installer = new Runnable() {
                  @Override public void run() {
                      try {
                          WebView webView = getBridge() == null ? null : getBridge().getWebView();
                          if (webView != null) {
                              webView.addJavascriptInterface(new DownloadBridge(), "ColetaFlowDownloads");
                              webView.evaluateJavascript(
                                  "(function(){" +
                                  "if(window.__coletaflowDownloadV2)return;" +
                                  "function saveLink(link,event){" +
                                  "if(!link||!link.href||link.dataset.cfSaving==='1')return false;" +
                                  "var href=link.href;" +
                                  "if(!href.startsWith('blob:')&&!href.startsWith('data:'))return false;" +
                                  "if(event){event.preventDefault();event.stopImmediatePropagation();}" +
                                  "link.dataset.cfSaving='1';" +
                                  "var name=link.getAttribute('download')||'coletaflow.xlsx';" +
                                  "fetch(href).then(function(r){if(!r.ok)throw new Error('Falha ao ler arquivo');return r.blob();})" +
                                  ".then(function(blob){return new Promise(function(resolve,reject){" +
                                  "var reader=new FileReader();reader.onloadend=function(){resolve(String(reader.result).split(',')[1]||'');};" +
                                  "reader.onerror=reject;reader.readAsDataURL(blob);" +
                                  "}).then(function(base64){if(!window.ColetaFlowDownloads)throw new Error('Ponte Android indisponível');" +
                                  "window.ColetaFlowDownloads.saveFile(base64,name,blob.type||'application/octet-stream');});})" +
                                  ".catch(function(err){link.dataset.cfSaving='0';alert('Falha no download: '+err.message);});" +
                                  "return true;" +
                                  "}" +
                                  "document.addEventListener('click',function(e){var a=e.target&&e.target.closest?e.target.closest('a[download]'):null;if(a)saveLink(a,e);},true);" +
                                  "var originalClick=HTMLAnchorElement.prototype.click;" +
                                  "HTMLAnchorElement.prototype.click=function(){if(this.hasAttribute('download')&&saveLink(this,null))return;return originalClick.call(this);};" +
                                  "window.__coletaflowDownloadV2=true;" +
                                  "})();", null);
                          }
                      } catch (Exception ignored) { }
                      handler.postDelayed(this, 500);
                  }
              };

              @Override public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  handler.post(installer);
              }

              private class DownloadBridge {
                  @JavascriptInterface public void saveFile(String base64, String fileName, String mimeType) {
                      try {
                          if (Build.VERSION.SDK_INT < 29) throw new IllegalStateException("Android 10 ou superior é necessário");
                          String safeName = fileName == null ? "coletaflow.xlsx" : fileName.replaceAll("[\\\\/:*?\"<>|]", "_");
                          ContentValues values = new ContentValues();
                          values.put(MediaStore.Downloads.DISPLAY_NAME, safeName);
                          values.put(MediaStore.Downloads.MIME_TYPE, mimeType == null || mimeType.isEmpty() ? "application/octet-stream" : mimeType);
                          values.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/ColetaFlow");
                          values.put(MediaStore.Downloads.IS_PENDING, 1);
                          Uri uri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                          if (uri == null) throw new IllegalStateException("Não foi possível criar o arquivo");
                          try (OutputStream output = getContentResolver().openOutputStream(uri)) {
                              if (output == null) throw new IllegalStateException("Não foi possível gravar o arquivo");
                              output.write(Base64.getDecoder().decode(base64));
                          }
                          values.clear();
                          values.put(MediaStore.Downloads.IS_PENDING, 0);
                          getContentResolver().update(uri, values, null, null);
                          runOnUiThread(() -> Toast.makeText(MainActivity.this, "Arquivo salvo em Downloads/ColetaFlow", Toast.LENGTH_LONG).show());
                      } catch (Exception error) {
                          runOnUiThread(() -> Toast.makeText(MainActivity.this, "Falha ao salvar: " + error.getMessage(), Toast.LENGTH_LONG).show());
                      }
                  }
              }
          }
          JAVA
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: coletaflow-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
