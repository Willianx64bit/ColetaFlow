name: Build ColetaFlow Android APK
# Rebuild requested after official-site UI refinements; keep native ML Kit and download bridge.

on:
  push:
    branches: [feature/shared-collections, integration/site-official-android-mlkit]
    paths:
      - 'capacitor.config.ts'
      - 'resources/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-apk.yml'
      - 'src/main.tsx'
      - 'src/App.tsx'
      - 'src/styles.css'
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      CF_ANDROID_LOCAL: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Build web app
        env:
          VITE_API_BASE_URL: ${{ github.ref_name == 'integration/site-official-android-mlkit' && 'https://integration-site-official-an.coletaflow.pages.dev' || 'https://feature-shared-collections.coletaflow.pages.dev' }}
        run: npm run build
      - name: Generate Android image resources
        run: |
          npm install --no-save sharp
          node --input-type=module -e "import sharp from 'sharp'; await sharp('resources/icon.svg').resize(1024,1024).png().toFile('resources/icon.png'); await sharp('resources/splash.svg').resize(1024,1024).png().toFile('resources/splash.png');"
      - name: Add Android platform
        run: npx cap add android
      - name: Generate launcher and splash resources
        run: |
          mkdir -p assets
          cp resources/icon.png assets/icon.png
          cp resources/splash.png assets/splash.png
          npx capacitor-assets generate --android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Ensure camera and internet permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          marker='<manifest '
          if 'android.permission.CAMERA' not in s:
              i=s.find('>', s.find(marker))+1
              s=s[:i]+'\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.INTERNET" />'+s[i:]
          p.write_text(s)
          PY
      - name: Configure native Android downloads
        run: |
          mkdir -p android/app/src/main/java/com/coletaflow/app
          cat > android/app/src/main/java/com/coletaflow/app/MainActivity.java <<'JAVA'
          package com.coletaflow.app;

          import android.content.ContentValues;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.View;
          import android.provider.MediaStore;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import android.widget.Toast;
          import com.getcapacitor.BridgeActivity;
          import java.io.OutputStream;
          import java.util.Base64;

          public class MainActivity extends BridgeActivity {
              private final Handler handler = new Handler(Looper.getMainLooper());
              private boolean bridgeReloadTriggered = false;
              private final Runnable installer = new Runnable() {
                  @Override public void run() {
                      try {
                          WebView webView = getBridge() == null ? null : getBridge().getWebView();
                          if (webView != null) {
                              // Keep the native WebView eligible for Android Autofill/password managers.
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                                  webView.setImportantForAutofill(View.IMPORTANT_FOR_AUTOFILL_YES);
                              }
                              webView.addJavascriptInterface(new DownloadBridge(), "ColetaFlowDownloads");
                              // Android WebView exposes newly-added JavascriptInterface objects
                              // after the next page load. Reload once after registration.
                              if (!bridgeReloadTriggered && webView.getUrl() != null) {
                                  bridgeReloadTriggered = true;
                                  webView.reload();
                              } else if (bridgeReloadTriggered) {
                                  webView.evaluateJavascript(
                                  "(function(){" +
                                  "if(!window.ColetaFlowDownloads)return;" +
                                  "if(window.__coletaflowDownloadV2)return;" +
                                  "function saveLink(link,event){" +
                                  "if(!link||!link.href||link.dataset.cfSaving==='1')return false;" +
                                  "var href=link.href;" +
                                  "if(!href.startsWith('blob:')&&!href.startsWith('data:'))return false;" +
                                  "if(event){event.preventDefault();event.stopImmediatePropagation();}" +
                                  "link.dataset.cfSaving='1';" +
                                  "var name=link.getAttribute('download')||'coletaflow.xlsx';" +
                                  "fetch(href).then(function(r){if(!r.ok)throw new Error('Falha ao ler arquivo');return r.blob();})" +
                                  ".then(function(blob){return new Promise(function(resolve,reject){" +
                                  "var reader=new FileReader();reader.onloadend=function(){resolve(String(reader.result).split(',')[1]||'');};" +
                                  "reader.onerror=reject;reader.readAsDataURL(blob);" +
                                  "}).then(function(base64){if(!window.ColetaFlowDownloads)throw new Error('Ponte Android indisponível');" +
                                  "window.ColetaFlowDownloads.saveFile(base64,name,blob.type||'application/octet-stream');});})" +
                                  ".catch(function(err){link.dataset.cfSaving='0';alert('Falha no download: '+err.message);});" +
                                  "return true;" +
                                  "}" +
                                  "document.addEventListener('click',function(e){var a=e.target&&e.target.closest?e.target.closest('a[download]'):null;if(a)saveLink(a,e);},true);" +
                                  "var originalClick=HTMLAnchorElement.prototype.click;" +
                                  "HTMLAnchorElement.prototype.click=function(){if(this.hasAttribute('download')&&saveLink(this,null))return;return originalClick.call(this);};" +
                                  "window.__coletaflowDownloadV2=true;" +
                                  "})();", null);
                              }
                          }
                      } catch (Exception ignored) { }
                      handler.postDelayed(this, 500);
                  }
              };

              @Override public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  handler.post(installer);
              }

              private class DownloadBridge {
                  @JavascriptInterface public void saveFile(String base64, String fileName, String mimeType) {
                      try {
                          if (Build.VERSION.SDK_INT < 29) throw new IllegalStateException("Android 10 ou superior é necessário");
                          String safeName = fileName == null ? "coletaflow.xlsx" : fileName.replaceAll("[\\\\/:*?\"<>|]", "_");
                          ContentValues values = new ContentValues();
                          values.put(MediaStore.Downloads.DISPLAY_NAME, safeName);
                          values.put(MediaStore.Downloads.MIME_TYPE, mimeType == null || mimeType.isEmpty() ? "application/octet-stream" : mimeType);
                          values.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/ColetaFlow");
                          values.put(MediaStore.Downloads.IS_PENDING, 1);
                          Uri uri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                          if (uri == null) throw new IllegalStateException("Não foi possível criar o arquivo");
                          try (OutputStream output = getContentResolver().openOutputStream(uri)) {
                              if (output == null) throw new IllegalStateException("Não foi possível gravar o arquivo");
                              output.write(Base64.getDecoder().decode(base64));
                          }
                          values.clear();
                          values.put(MediaStore.Downloads.IS_PENDING, 0);
                          getContentResolver().update(uri, values, null, null);
                          runOnUiThread(() -> Toast.makeText(MainActivity.this, "Arquivo salvo em Downloads/ColetaFlow", Toast.LENGTH_LONG).show());
                      } catch (Exception error) {
                          runOnUiThread(() -> Toast.makeText(MainActivity.this, "Falha ao salvar: " + error.getMessage(), Toast.LENGTH_LONG).show());
                      }
                  }
              }
          }
          JAVA
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: coletaflow-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
