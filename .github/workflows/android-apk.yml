name: Build ColetaFlow Android APK

on:
  push:
    branches: [feature/shared-collections]
    paths:
      - 'capacitor.config.ts'
      - 'resources/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-apk.yml'
      - 'src/main.tsx'
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Build web app
        run: npm run build
      - name: Generate Android image resources
        run: |
          npm install --no-save sharp
          node --input-type=module -e "import sharp from 'sharp'; await sharp('resources/icon.svg').resize(1024,1024).png().toFile('resources/icon.png'); await sharp('resources/splash.svg').resize(1024,1024).png().toFile('resources/splash.png');"
      - name: Add Android platform
        run: npx cap add android
      - name: Generate launcher and splash resources
        run: |
          npx --yes @capacitor/assets generate --android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Ensure camera and internet permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          marker='<manifest '
          if 'android.permission.CAMERA' not in s:
              i=s.find('>', s.find(marker))+1
              s=s[:i]+'\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.INTERNET" />'+s[i:]
          p.write_text(s)
          PY
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: coletaflow-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
