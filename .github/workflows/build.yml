name: Build ColetaFlow

on:
  push:
    branches: [main, feature/shared-collections]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Check API syntax
        run: find api -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Smoke test XLSX formatting engine
        run: node --input-type=module -e "import ExcelJS from 'exceljs'; const wb=new ExcelJS.Workbook(); const ws=wb.addWorksheet('teste'); ws.getCell('A1').value='ok'; ws.getCell('A1').font={bold:true}; const bytes=await wb.xlsx.writeBuffer(); const check=new ExcelJS.Workbook(); await check.xlsx.load(bytes); if(check.getWorksheet('teste')?.getCell('A1').text!=='ok') process.exit(1);"
      - name: Verify patched SheetJS and CSV parser
        run: node scripts/smoke-xlsx.mjs
      - name: Build
        run: npm run build
